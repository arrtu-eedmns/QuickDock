<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
    a { color: #2383e2; } a:hover { color: #1b6bb8; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; width: 880px; height: 640px; padding: 72px; box-sizing: border-box; background: #0d0d0e;">

  <svg viewBox="22.5 22.5 512 512" width="340" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QuickDock">
    <path d="M153.03 153.03 A150 150 0 1 1 358.97 358.97 A150 150 0 0 0 153.03 153.03 Z" fill="#f4f4f5"></path>
    <path d="M153.03 153.03 A150 150 0 1 0 358.97 358.97 A150 150 0 0 1 153.03 153.03 Z" fill="#f4f4f5"></path>
    <path d="M241.59 241.59 L476.35 431.09 L386.18 431.44 Z" fill="#f4f4f5"></path>
    <path d="{{starD}}" transform="{{starTransform}}" fill="{{corEstrela}}"></path>
  </svg>

  <div style="font-size: 46px; font-weight: 500; letter-spacing: -0.025em; color: #f2f2f3;">QuickDock</div>

</div>
</x-dc>
<script data-dc-script data-props='{"corEstrela":{"editor":"color","default":"#F4F4F5","options":["#F4F4F5","#2383E2","#7C3AED"],"section":"Estrela"},"starAngle":{"editor":"range","default":45,"min":0,"max":90,"step":1,"unit":"°","section":"Estrela"},"starSize":{"editor":"range","default":58,"min":38,"max":80,"step":1,"section":"Estrela"},"$preview":{"width":880,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const r = this.props.starSize ?? 58;
    const q = +(r * 0.18).toFixed(2);
    return {
      corEstrela: this.props.corEstrela ?? '#F4F4F5',
      starD: 'M0 ' + (-r) + ' C0 ' + (-q) + ' ' + q + ' 0 ' + r + ' 0 C' + q + ' 0 0 ' + q + ' 0 ' + r +
             ' C0 ' + q + ' ' + (-q) + ' 0 ' + (-r) + ' 0 C' + (-q) + ' 0 0 ' + (-q) + ' 0 ' + (-r) + ' Z',
      starTransform: 'translate(251.23 251.23) rotate(' + (this.props.starAngle ?? 45) + ')'
    };
  }
}
</script>
</body>
</html>
