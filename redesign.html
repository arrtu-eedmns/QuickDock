<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QuickDock</title>
        <style>
            ::-webkit-scrollbar {
                display: none;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            #mobile {
                background: pink;
                width: 1080px;
                height: 1920px;
                display: grid;
                zoom: .4;
                grid-template-rows: auto 1fr;
            }
            header {
                display: grid;
                grid-auto-flow: column;
                background: #eee;
                padding: 4px;
                gap: 4px;
                grid-template-columns: auto auto 1fr auto auto;
                #mMenu, #mSync {
                    width: 56px;
                    height: 56px;
                    border-radius: calc(56px / 2);
                }
                #mMore {
                    width: 48px;
                    height: 56px;
                    border-radius: calc(56px / 2);
                #mMenu, #mMore {
                    position: relative;
                    z-index: 4;
                }
                #mAdd {
                    width: 72px;
                    height: 56px;
                    border-radius: calc(56px / 2);
                    position: relative;
                    z-index: 3;
                }
                #mAdd::after {
                    content: '';
                    position: absolute;
                    top: -4px;
                    bottom: -4px;
                    left: 50%;
                    right: -36px;
                    background: linear-gradient(to right, #eee 20%, transparent 100%);
                    pointer-events: none;
                    z-index: -1;
                }
                #mSync {
                    position: relative;
                    z-index: 3;
                }
                #mSync::after {
                    content: '';
                    position: absolute;
                    top: -4px;
                    bottom: -4px;
                    right: 50%;
                    left: -36px;
                    background: linear-gradient(to left, #eee 20%, transparent 100%);
                    pointer-events: none;
                    z-index: -1;
                }
                #mTabs {
                    /* background: #ccc; */
                    border-radius: 4px;
                    gap: 4px;
                    display: grid;
                    grid-auto-flow: column;
                    justify-content: start;
                    align-items: center;
                    overflow-x: auto;
                    margin-left: -40px;
                    margin-right: -32px;
                    padding-left: 40px;
                    padding-right: 32px;
                    position: relative;
                    z-index: 1;
                    -webkit-mask-image: linear-gradient(to right, transparent 0px, black 40px, black calc(100% - 32px), transparent 100%);
                    mask-image: linear-gradient(to right, transparent 0px, black 40px, black calc(100% - 32px), transparent 100%);
                    .tab {
                        display: grid;
                        grid-auto-flow: column;
                        align-items: center;
                        background: #aaa;
                        height: 40px;
                        gap: 6px;
                        padding: 8px 12px;
                        border-radius: 20px;
                        text-wrap: nowrap;
                        span:first-child {
                            background: #888;
                            width: 24px;
                            height: 24px;
                            border-radius: 12px;
                            display: block;
                        }
                    }
                }
            }
            main {
                display: grid;
                background: #ddd;
                padding: 4px;
                gap: 16px;
                #notes {
                    background: #fff;
                }
                #docs {
                    background: #fff;
                }
            }

            button {
                background: #ccc;
                border: none;
                font-weight: 900;
            }
            
        </style>
    </head>
    <body>
        <div id="mobile">
            <header id="mHeader">
                <button id="mMenu">H</button>
                <button id="mAdd">+</button>
                <section id="mTabs">
                    <button class="tab"><span>.</span><span>Titulo 1</span></button>
                    <button class="tab"><span>.</span><span>Titulo 2</span></button>
                    <button class="tab"><span>.</span><span>Titulo 3</span></button>
                    <button class="tab"><span>.</span><span>Titulo 4</span></button>
                    <button class="tab"><span>.</span><span>Titulo 5</span></button>
                    <button class="tab"><span>.</span><span>Titulo 6</span></button>
                    <button class="tab"><span>.</span><span>Titulo 7</span></button>
                    <button class="tab"><span>.</span><span>Titulo 8</span></button>
                    <button class="tab"><span>.</span><span>Titulo 9</span></button>
                </section>
                <button id="mSync">S</button>
                <button id="mMore">M</button>
            </header>
            <main id="mMain">
                <section id="notes"></section>
                <section id="docs"></section>
            </main>
        </div>
    </body>
</html>
