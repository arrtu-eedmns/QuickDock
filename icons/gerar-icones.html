<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerar ícones QuickDock</title>
  <style>
    body { font-family: system-ui, 'Segoe UI', sans-serif; padding: 28px; background: #191919; color: #e8e8e8; }
    h2 { font-weight: 600; letter-spacing: -0.3px; }
    p { color: #9b9b9b; font-size: 13px; line-height: 1.55; max-width: 56ch; }
    code { font-family: 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #e8e8e8; }
    .previews { display: flex; align-items: flex-end; gap: 20px; margin: 24px 0; }
    .label { text-align: center; font-size: 12px; color: #5a5a5a; margin-top: 8px; }
    button {
      padding: 9px 20px; background: #2383e2; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
    }
    button:hover { background: #1b6bb8; }
  </style>
</head>
<body>
  <h2>Ícones — QuickDock</h2>
  <p>
    Desenha a marca a partir dos mesmos paths de <code>quickdock-mark.svg</code> (atualizada conforme <code>QD-atualizado.svg</code>).
    Clique em "Baixar todos" e salve os 5 PNGs aqui na pasta <code>icons/</code>.
  </p>
  <div class="previews" id="previews"></div>
  <button onclick="downloadAll()">Baixar todos</button>

  <script>
    const LUNE_A = 'M153.03 153.03 A150 150 0 1 1 358.97 358.97 A150 150 0 0 0 153.03 153.03 Z';
    const LUNE_B = 'M153.03 153.03 A150 150 0 1 0 358.97 358.97 A150 150 0 0 1 153.03 153.03 Z';
    const LUNE_A_C = 'M155.51 155.51 A150 150 0 1 1 356.49 356.49 A150 150 0 0 0 155.51 155.51 Z';
    const LUNE_B_C = 'M155.51 155.51 A150 150 0 1 0 356.49 356.49 A150 150 0 0 1 155.51 155.51 Z';

    // Marca cheia e marca compacta (com a nova cauda de base reta de QD-atualizado.svg)
    const MARKS = {
      full: {
        paths: [LUNE_A, LUNE_B, 'M241.59 241.59 L476.35 431.09 L386.18 431.44 Z'],
        star: 'M0 -58 C0 -10.4 10.4 0 58 0 C10.4 0 0 10.4 0 58 C0 10.4 -10.4 0 -58 0 C-10.4 0 0 -10.4 0 -58 Z',
        minX: 80.56, maxX: 476.35, minY: 80.56, maxY: 431.44
      },
      compact: {
        paths: [LUNE_A_C, LUNE_B_C, 'M241.59 241.59 L476.35 431.09 L386.18 431.44 Z'],
        star: 'M0 -64 C0 -11.52 11.52 0 64 0 C11.52 0 0 11.52 0 64 C0 11.52 -11.52 0 -64 0 C-11.52 0 0 -11.52 0 -64 Z',
        minX: 72.06, maxX: 476.35, minY: 72.06, maxY: 431.44
      }
    };

    const STAR_AT = [251.23, 251.23];
    const BG = '#191919';
    const INK = '#f4f4f5';

    // Quanto menor o ícone, menos margem cabe — a marca precisa ocupar mais do quadro.
    function fillFraction(size) {
      if (size <= 16) return 0.80;
      if (size <= 48) return 0.72;
      if (size <= 128) return 0.70;
      return 0.65;
    }

    function drawIcon(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const mark = size <= 32 ? MARKS.compact : MARKS.full;

      ctx.beginPath();
      if (size <= 128) {
        ctx.roundRect(0, 0, size, size, size * 0.22);
      } else {
        ctx.rect(0, 0, size, size);
      }
      ctx.fillStyle = BG;
      ctx.fill();

      const spanX = (mark.maxX - mark.minX) / fillFraction(size);
      const spanY = (mark.maxY - mark.minY) / fillFraction(size);
      const span = Math.max(spanX, spanY);
      const offX = (mark.minX + mark.maxX) / 2 - span / 2;
      const offY = (mark.minY + mark.maxY) / 2 - span / 2;
      const k = size / span;

      ctx.save();
      ctx.setTransform(k, 0, 0, k, -offX * k, -offY * k);
      ctx.fillStyle = INK;
      mark.paths.forEach(d => ctx.fill(new Path2D(d)));

      ctx.translate(STAR_AT[0], STAR_AT[1]);
      ctx.rotate(Math.PI / 4);
      ctx.fill(new Path2D(mark.star));
      ctx.restore();

      return c;
    }

    const sizes = [512, 192, 128, 48, 16];
    const previews = document.getElementById('previews');
    sizes.forEach(size => {
      const wrap = document.createElement('div');
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = size + '×' + size;
      wrap.appendChild(drawIcon(size));
      wrap.appendChild(label);
      previews.appendChild(wrap);
    });

    function downloadAll() {
      sizes.forEach(size => {
        const a = document.createElement('a');
        a.download = size + '.png';
        a.href = drawIcon(size).toDataURL('image/png');
        a.click();
      });
    }
  </script>
</body>
</html>
