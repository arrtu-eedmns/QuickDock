<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerar ícones QuickDock — Densidade Quântica</title>
  <style>
    body { font-family: system-ui, 'Segoe UI', sans-serif; padding: 28px; background: #101014; color: #f4f4f5; }
    h2 { font-weight: 700; letter-spacing: -0.3px; color: #fff; margin-bottom: 6px; }
    p { color: #a1a1aa; font-size: 13.5px; line-height: 1.55; max-width: 60ch; margin-bottom: 20px; }
    code { font-family: monospace; font-size: 12px; color: #c4b5fd; background: rgba(255,255,255,0.06); padding: 2px 5px; border-radius: 4px; }
    .previews { display: flex; align-items: flex-end; gap: 20px; margin: 24px 0; flex-wrap: wrap; }
    .item-wrap { text-align: center; }
    .label { font-size: 11.5px; font-family: monospace; color: #71717a; margin-top: 8px; }
    button {
      padding: 10px 22px; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 600;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35); transition: opacity 0.15s;
    }
    button:hover { opacity: 0.92; }
    canvas { border-radius: 18%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <h2>Ícones QuickDock — Densidade Quântica</h2>
  <p>
    Renderiza os ícones do sistema a partir de <code>icon.svg</code> (Degradê Diagonal 135° + Campo Quântico + Glow Central).
    Clique em "Baixar todos" para salvar os PNGs em <code>icons/</code>.
  </p>
  <div class="previews" id="previews">Carregando visualização...</div>
  <button onclick="downloadAll()">Baixar todos os PNGs</button>

  <script>
    const sizes = [512, 192, 128, 48, 16];
    const canvases = {};

    async function init() {
      const res = await fetch('icon.svg');
      const svgText = await res.text();
      const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();

      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });

      const previews = document.getElementById('previews');
      previews.innerHTML = '';

      for (const size of sizes) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, size, size);
        canvases[size] = c;

        const wrap = document.createElement('div');
        wrap.className = 'item-wrap';
        wrap.appendChild(c);
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `${size}×${size}`;
        wrap.appendChild(label);
        previews.appendChild(wrap);
      }

      URL.revokeObjectURL(url);
    }

    function downloadAll() {
      sizes.forEach(size => {
        const c = canvases[size];
        if (!c) return;
        const a = document.createElement('a');
        a.download = `${size}.png`;
        a.href = c.toDataURL('image/png');
        a.click();
      });
    }

    init();
  </script>
</body>
</html>
